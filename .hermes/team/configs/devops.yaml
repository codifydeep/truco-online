model: {default: "qwen3.5:9b", provider: ollama-local}
providers:
  ollama-local: {api: "http://host.docker.internal:11434/v1", discover_models: false, models: ["qwen3.5:9b"]}
agent:
  max_turns: 150
  reasoning_effort: medium
  disabled_toolsets: [delegation, computer_use, image_gen, video_gen]
platform_toolsets:
  cli: [terminal, file, skills, todo, memory, clarify]
  telegram: [terminal, file, skills, todo, memory, clarify]
terminal:
  backend: local
  timeout: 600
  home_mode: profile
skills:
  external_dirs:
    - /Users/weber/Documents/projetos_pessoais_desenv/hermes/truco-online/.hermes/skills
    - /opt/data/skills/devops/sdlc-review
    - /opt/data/skills/software-development/github
    - /opt/data/skills/software-development/systematic-debugging
    - /opt/data/skills/software-development/test-driven-development
    - /opt/data/skills/software-development/spike
auxiliary:
  title_generation: {enabled: false}
  goal_judge: {provider: main, model: "qwen3.5:9b"}
kanban:
  review_dispatch: true
  auto_decompose: false
  dispatch_interval_seconds: 15
  orchestrator_profile: techlead
  default_assignee: techlead
  auto_subscribe_on_create: true
  max_in_progress: 2
  max_in_progress_per_profile: 1
  failure_limit: 2
group_sessions_per_user: false
telegram: &telegram
  allowed_chats: []
  group_allowed_chats: []
  require_mention: true
  exclusive_bot_mentions: true
  observe_unmentioned_group_messages: true
  allow_bots: mentions
  reply_to_mode: false
platforms:
  telegram:
    <<: *telegram
    enabled: false
session_reset: {mode: none}
_config_version: 40
