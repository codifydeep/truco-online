model: &local_model
  default: "qwen3.5:9b"
  provider: ollama-local
providers:
  ollama-local:
    api: http://host.docker.internal:11434/v1
    discover_models: false
    models: ["qwen3.5:9b"]
agent:
  max_turns: 150
  reasoning_effort: medium
  disabled_toolsets: [delegation, computer_use, image_gen, video_gen]
toolsets: [kanban]
platform_toolsets:
  cli: [web, terminal, file, skills, todo, memory, clarify]
  telegram: [web, terminal, file, skills, todo, memory, clarify]
terminal:
  backend: local
  cwd: /Users/weber/Documents/projetos_pessoais_desenv/hermes/truco-online
  timeout: 300
  home_mode: profile
skills:
  external_dirs:
    - /Users/weber/Documents/projetos_pessoais_desenv/hermes/truco-online/.hermes/skills
    - /opt/data/skills/research/grounded-citations
    - /opt/data/skills/research/grounded-web-research-notes
    - /opt/data/skills/software-development/github
auxiliary:
  title_generation: {enabled: false}
  goal_judge: {provider: main, model: "qwen3.5:9b"}
  kanban_decomposer: {provider: main, model: "qwen3.5:9b"}
  triage_specifier: {provider: main, model: "qwen3.5:9b"}
kanban:
  review_dispatch: false
  auto_decompose: false
group_sessions_per_user: false
telegram: &telegram
  allowed_chats: []
  group_allowed_chats: []
  require_mention: true
  mention_patterns:
    - '^\[VERSAO:v[0-9]+\.[0-9]+\]'
  exclusive_bot_mentions: true
  observe_unmentioned_group_messages: true
  allow_bots: mentions
  reply_to_mode: false
platforms:
  telegram:
    <<: *telegram
    enabled: false
session_reset: {mode: none}
_config_version: 40
