model:
  default: deepseek/deepseek-v4-flash-0731
  provider: openrouter
agent:
  max_turns: 40
  reasoning_effort: medium
  disabled_toolsets:
  - delegation
  - computer_use
  - image_gen
  - video_gen
toolsets:
- kanban
platform_toolsets:
  cli:
  - web
  - file
  - skills
  - todo
  - memory
  - clarify
  telegram:
  - web
  - file
  - skills
  - todo
  - memory
  - clarify
terminal:
  backend: local
  cwd: /Users/weber/Documents/projetos_pessoais_desenv/hermes/truco-online
  timeout: 300
  home_mode: profile
skills:
  external_dirs:
  - /Users/weber/Documents/projetos_pessoais_desenv/hermes/truco-online/.hermes/skills
  - /opt/data/skills/research/grounded-citations
  - /opt/data/skills/research/grounded-web-research-notes
auxiliary:
  title_generation:
    enabled: false
  goal_judge:
    provider: main
    model: deepseek/deepseek-v4-flash-0731
  kanban_decomposer:
    provider: main
    model: deepseek/deepseek-v4-flash-0731
  triage_specifier:
    provider: main
    model: deepseek/deepseek-v4-flash-0731
kanban:
  review_dispatch: true
  auto_decompose: false
  dispatch_in_gateway: false
  max_in_progress: 2
  max_in_progress_per_profile: 1
  failure_limit: 2
group_sessions_per_user: false
telegram:
  allowed_chats: &id001 []
  group_allowed_chats: &id002 []
  require_mention: true
  mention_patterns: &id003
  - ^\[VERSAO:v[0-9]+\.[0-9]+\]
  exclusive_bot_mentions: true
  observe_unmentioned_group_messages: true
  allow_bots: mentions
  reply_to_mode: false
platforms:
  telegram:
    allowed_chats: *id001
    group_allowed_chats: *id002
    require_mention: true
    mention_patterns: *id003
    exclusive_bot_mentions: true
    observe_unmentioned_group_messages: true
    allow_bots: mentions
    reply_to_mode: false
    enabled: false
session_reset:
  mode: none
_config_version: 40
