<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Truco Online — Lobby v0.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0f1216; color: #e8edee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { max-width: 480px; width: 100%; padding: 24px; text-align: center; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #9ad37d; }
    .subtitle { font-size: 13px; color: #6c757d; margin-bottom: 20px; }
    .nickname-input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #2a2f36; background: #1a1e24; color: #e8edee; font-size: 15px; margin-bottom: 12px; outline: none; }
    .nickname-input::placeholder { color: #495057; }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .btn { padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; border: none; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #3a86ff; color: #fff; }
    .btn-secondary { background: #495057; color: #e8edee; }
    .room-list { margin-top: 24px; width: 100%; max-height: 300px; overflow-y: auto; }
    .room-card { background: #1a1e24; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #9ad37d; }
    .room-card.full { border-left-color: #ff5252; }
    .room-name { font-weight: 600; flex: 1; margin-right: 8px; word-break: break-all; }
    .room-status { font-size: 12px; color: #99aab5; display: flex; align-items: center; gap: 4px; }
    .icon-clock { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .full .room-status { color: #ff5252; }
    .full .icon-clock { animation-play-state: paused; }
    .spinner { width: 14px; height: 14px; border: 2px solid #ff5252; border-top-color: transparent; border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.6; } }
    .fade-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
    .fade-overlay.active { display: flex; animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .transition-screen { width: 92%; background: #1a1e24; padding: 28px; border-radius: 16px; text-align: center; animation: slideUp 0.5s ease-out; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .loading-bar { height: 4px; background: repeating-conic-gradient(#3a86ff 0%, #3a86ff 5%, transparent 5%, transparent 10%) 50% / 10% 10%; border-radius: 2px; margin-top: 12px; animation: loadingProgress 1.5s linear infinite; }
    @keyframes loadingProgress { to { background-position: 0 0; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Truco Online</h1>
    <div class="subtitle">Jogue com um amigo na mesma máquina. Sem cadastro.</div>

    <!-- Tela inicial / lobby -->
    <section id="screen-lobby" style="display:block;">
      <input type="text" class="nickname-input" id="nickname" placeholder="Digite seu apelido..." maxlength="16" autocomplete="off" />
      <div class="btn-group">
        <button class="btn btn-primary" onclick="createRoom()">Criar nova sala</button>
        <button class="btn btn-secondary" onclick="showJoinView()">Entrar em sala</button>
      </div>

      <div class="room-list" id="roomList" style="display:none;" aria-label="lista de salas disponíveis">
        <!-- Salas seriam injetadas aqui via JS -->
      </div>
    </section>

    <!-- Tela para entrar em sala -->
    <section id="screen-join" style="display:none;" aria-label="entrar em sala">
      <h2 style="margin-bottom:8px;">Entrar em uma sala</h2>
      <div class="subtitle" style="margin-bottom:16px;">Uma sala só aceita dois jogadores. Escolha uma abaixo:</div>
      <div class="room-list" id="joinRoomList"></div>
      <button class="btn btn-secondary" onclick="goBackToLobby()" style="margin-top:12px; width:100%;">Voltar</button>
    </section>

    <!-- Tela de pre-partida -->
    <section id="screen-prestart" class="fade-overlay">
      <div class="transition-screen">
        <h2>Vamos jogar!</h2>
        <p style="color:#99aab5; font-size:14px; margin:8px 0 16px;">Sincronizando ambiente...</p>
        <div class="loading-bar"></div>
      </div>
    </section>
  </div>

  <script>
    let currentUser = "";
    const rooms = [
      { id: "room_a1", name: "Sala_01", full: false },
      { id: "room_b2", name: "Sala_02", full: true },
    ];

    function setNickname(nick) { currentUser = nick || "jogador_invitado"; }
    function createRoom() { if (!currentUser) return alert("Digite um apelido primeiro."); alert(`Sala criada com URL: http://localhost:3000/?room=${Date.now().toString(16).slice(-6)}. Compartilhe no grupo.`, ); }
    function showJoinView() { if (!currentUser) return alert("Digite um apelido primeiro."); document.getElementById("screen-lobby").style.display="none"; document.getElementById("screen-join").style.display="block"; renderJoinList(); }
    function renderJoinList() { const list = document.getElementById("joinRoomList"); list.innerHTML = rooms.map(r => `<div class="room-card ${r.full?"full":""}">${escapeHtml(r.name)} <span class="room-status">${!r.full?"⏰": "🚫 Sala cheia"}</span></div>`).join(""); }
    function goBackToLobby() { document.getElementById("screen-lobby").style.display="block"; document.getElementById("screen-join").style.display="none"; renderRoomList(); }
    function showPreStart() { const overlay = document.getElementById("screen-prestart"); overlay.classList.add("active"); setTimeout(() => overlay.classList.remove("active"), 1500); // Simula transição para 3D }

    function renderRoomList() { const list = document.getElementById("roomList"); list.style.display = "block"; list.innerHTML = rooms.map(r => `<div class="room-card ${r.full?"full":""}"><span class="room-name">${escapeHtml(r.name)}</span><span class="room-status">${!r.full?`⏰ Aguardando...`: "🚫 Sala cheia"}</span></div>`).join(""); }

    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
  </script>
</body>
</html>
